# ==============================================================================
# AFF 推广链接 301 隔离与合规跳转规则 (适用于 VPS / 宝塔面板 Nginx)
# 使用方式：在站点的 nginx.conf 或 宝塔站点配置的 server 块内添加：
# include /path/to/nginx-redirects.conf;
# ==============================================================================

