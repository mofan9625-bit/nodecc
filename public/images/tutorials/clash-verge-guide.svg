<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad1)" />
  <circle cx="700" cy="80" r="160" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="120" cy="380" r="140" fill="#818cf8" opacity="0.15" filter="blur(40px)" />

  <!-- Grid lines -->
  <path d="M0,100 L800,100 M0,200 L800,200 M0,300 L800,300 M0,400 L800,400" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <path d="M200,0 L200,450 M400,0 L400,450 M600,0 L600,450" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- Center Card Illustration -->
  <g transform="translate(180, 75)">
    <rect width="440" height="300" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <!-- Header bar -->
    <rect width="440" height="46" rx="20" fill="rgba(0,0,0,0.25)" />
    <circle cx="28" cy="23" r="6" fill="#f87171" />
    <circle cx="48" cy="23" r="6" fill="#fbbf24" />
    <circle cx="68" cy="23" r="6" fill="#34d399" />
    <text x="220" y="28" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Clash Verge Rev · TUN Mode</text>

    <!-- Node routing graphics -->
    <rect x="40" y="80" width="100" height="50" rx="8" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1" />
    <text x="90" y="110" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="12" font-weight="700">Sub URL</text>

    <path d="M140,105 L210,105" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" />

    <rect x="210" y="70" width="180" height="70" rx="10" fill="rgba(129,140,248,0.25)" stroke="#818cf8" stroke-width="1.5" />
    <text x="300" y="100" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Meta Kernel</text>
    <text x="300" y="122" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="11">TUN 虚拟网卡接管</text>

    <!-- Output streams -->
    <path d="M390,90 L420,90 C430,90 435,160 380,180" fill="none" stroke="#34d399" stroke-width="2" />
    <rect x="40" y="170" width="360" height="90" rx="12" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="70" cy="215" r="16" fill="#38bdf8" opacity="0.3" />
    <path d="M64,215 L76,215 M70,209 L70,221" stroke="#38bdf8" stroke-width="2" />
    <text x="100" y="206" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">智能规则分流开启</text>
    <text x="100" y="228" fill="#94a3b8" font-family="sans-serif" font-size="11">国内直连 0 延迟 · 国外无感秒切 IPLC 专线</text>
  </g>

  <!-- Tag Pill -->
  <rect x="50" y="45" width="110" height="30" rx="15" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" />
  <text x="105" y="65" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">客户端教程</text>
</svg>
