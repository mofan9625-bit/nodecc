<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" />
  <circle cx="680" cy="90" r="150" fill="#3b82f6" opacity="0.18" filter="blur(40px)" />
  <circle cx="150" cy="360" r="160" fill="#06b6d4" opacity="0.15" filter="blur(40px)" />

  <!-- Center Card Illustration -->
  <g transform="translate(180, 75)">
    <rect width="440" height="300" rx="20" fill="url(#cardGrad4)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Phone / Rocket icon -->
    <circle cx="120" cy="150" r="60" fill="rgba(37,99,235,0.2)" stroke="#3b82f6" stroke-width="2" />
    <path d="M120,110 L135,140 L125,140 L125,165 L115,165 L115,140 L105,140 Z" fill="#60a5fa" />
    <polygon points="115,168 120,180 125,168" fill="#f59e0b" />

    <text x="210" y="115" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Shadowrocket 小火箭</text>
    <text x="210" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">美区 Apple ID 下载与订阅导入</text>
    <text x="210" y="165" fill="#38bdf8" font-family="sans-serif" font-size="12">按需求分流 · 节点延迟测速 · 自动更新</text>
    
    <rect x="210" y="190" width="180" height="36" rx="8" fill="#2563eb" />
    <text x="300" y="213" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">配置分流规则模式</text>
  </g>

  <!-- Tag Pill -->
  <rect x="50" y="45" width="110" height="30" rx="15" fill="rgba(59,130,246,0.25)" stroke="#60a5fa" />
  <text x="105" y="65" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">客户端教程</text>
</svg>
