<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1e2d" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" />
  <circle cx="700" cy="100" r="150" fill="#10b981" opacity="0.15" filter="blur(40px)" />
  <circle cx="100" cy="350" r="140" fill="#0284c7" opacity="0.15" filter="blur(40px)" />

  <!-- Center Card Illustration -->
  <g transform="translate(180, 75)">
    <rect width="440" height="300" rx="20" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- IPLC vs Public Transit comparison diagram -->
    <!-- Lane 1: IPLC line -->
    <rect x="25" y="30" width="390" height="110" rx="12" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5" />
    <text x="45" y="60" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">IPLC 国际内网物理专线</text>
    <text x="45" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">深圳/上海入口 ──── [点对点海底光缆内网] ──── 香港/日本出口</text>
    <rect x="300" y="42" width="100" height="24" rx="12" fill="#059669" />
    <text x="350" y="58" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">0% 丢包 / 无GFW</text>

    <!-- Lane 2: Normal Public Transit line -->
    <rect x="25" y="160" width="390" height="110" rx="12" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5" />
    <text x="45" y="190" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="bold">普通公网中继 / 直连线路</text>
    <text x="45" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">国内宽带 ─── [公网国际出口互联 GFW 审查] ─── 海外服务器</text>
    <rect x="295" y="172" width="105" height="24" rx="12" fill="#dc2626" />
    <text x="347" y="188" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">晚高峰 20%+ 丢包</text>
  </g>

  <!-- Tag Pill -->
  <rect x="50" y="45" width="110" height="30" rx="15" fill="rgba(16,185,129,0.25)" stroke="#34d399" />
  <text x="105" y="65" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">技术科普</text>
</svg>
